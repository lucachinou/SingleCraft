<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SingleCraft - Global Settings</title>
    <style>
        .version-footer {
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #666;
        }
        .version-footer button {
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="header" style="display: flex;">
        <p id="PagesTree"><a href="/home">Home</a> > <a id="ServerSetting">Global Settings</a> </p>
        <button id="SettingsButton" style="display: block; margin-left: auto" disabled>Settings</button>
    </div>

    <div class="settings"></div>

    <div class="settings-jar">
        <div id="jar-form">
            <input id="jar-name" placeholder="Minecraft 26.1" required>
            <input id="jar-version" placeholder="default.jar" required>
            <input id="jar-start_command" value="java -Xmx{max_memory}M -jar {file_name} nogui" required>
            <button id="add-jar">Add Jar</button>
        </div>
        <div class="jar-list"></div>
    </div>

    <div class="version-footer">
        <span>Commit: <span id="current-commit">...</span></span>
        <span id="update-status">Checking for updates...</span>
        <button id="check-update">Check for updates</button>
    </div>

<script>
    function getCurrentVersion() {
        let commitSpan = document.getElementById("current-commit");

        return fetch('/API/Settings/GetCurrentVersion')
            .then(res => res.json())
            .then(data => {
                commitSpan.textContent = data.success && data.version ? data.version : "Unknown";
            })
            .catch(() => {
                commitSpan.textContent = "Unknown";
            })
    }

    function checkUpdate() {
        let status = document.getElementById("update-status");
        status.textContent = "Checking for updates...";
        status.style.color = "";

        return fetch('/API/Settings/IsUpdateAvailable')
            .then(res => res.json())
            .then(data => {
                if (!data.success) {
                    status.textContent = "Unable to check for updates.";
                    status.style.color = "orange";
                    return;
                }

                if (data.is_update_available) {
                    status.textContent = "An update is available (latest commit: " + data.latest_commit + ")";
                    status.style.color = "red";
                } else {
                    status.textContent = "SingleCraft is up to date (" + data.latest_commit + ")";
                    status.style.color = "green";
                }
            })
            .catch(() => {
                status.textContent = "Unable to check for updates.";
                status.style.color = "orange";
            })
    }

    document.getElementById("check-update").addEventListener("click", () => {
        getCurrentVersion();
        checkUpdate();
    })

    function getInstalledVersion() {
        fetch('/API/Settings/GetInstalledVersion')
        .then(res => res.json())
        .then(data => {
            let jar_list = document.getElementsByClassName("jar-list")[0];
            jar_list.innerHTML = '';
            for (data of data.version) {
                let div = document.createElement("div");
                let name = document.createElement("p");
                let version = document.createElement("p");
                let start_command = document.createElement("p");
                let delete_button = document.createElement("button");

                name.textContent = data[0];
                version.textContent = data[1];
                start_command.textContent = data[2];
                delete_button.textContent = "Delete";

                const jar_name = data[0];
                delete_button.addEventListener("click", () => {
                    fetch("/API/Settings/RemoveInstalledVersion?name="+jar_name, {method: "DELETE"})
                    .then(res => {
                        getInstalledVersion();
                    })
                })

                div.id = "jar-info"

                div.appendChild(name);
                div.appendChild(version);
                div.appendChild(start_command);
                div.appendChild(delete_button);
                jar_list.appendChild(div);
            }
        })
    }

    document.getElementById("add-jar").addEventListener("click", (e) => {
        fetch("/API/Settings/AddInstalledVersion", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(
                {"name": document.getElementById("jar-name").value,
                    "version": document.getElementById("jar-version").value,
                    "start_command": document.getElementById("jar-start_command").value
                })
        })
        .then(res => {
            getInstalledVersion();
        })
    })

    document.addEventListener('DOMContentLoaded', () => {
        fetch('/API/Settings/GetSettings')
            .then(res => res.json())
            .then(data => {
                let settingsDiv = document.getElementsByClassName("settings")[0];
                for (let setting of data.settings) {
                    let settingDiv = document.createElement("div");
                    let label = document.createElement("label");
                    let input = document.createElement("input");

                    label.textContent = setting[1];
                    //input.type = setting.type === "boolean" ? "checkbox" : "text";
                    input.value = setting[2];
                    //if (setting.type === "boolean") {
                    //    input.checked = setting.value;
                    //}

                    input.addEventListener("keydown", (evt) => {
                        if (evt.key === "Enter") {
                            evt.preventDefault()
                            let value = input.type === "checkbox" ? input.checked : input.value;
                            fetch("/API/Settings/UpdateSetting?setting_id="+setting[0]+"&setting_value="+evt.target.value, {method: "POST", body: JSON.stringify({value: value}), headers: {"Content-Type": "application/json"}})
                                .then(res => res.json())
                                .then(data => {
                                    console.log(data);
                                })
                        }
                    })

                    settingDiv.appendChild(label);
                    settingDiv.appendChild(input);
                    settingsDiv.appendChild(settingDiv);
                }
            })

        getCurrentVersion();
        checkUpdate();
        getInstalledVersion();
    })
</script>
</body>
</html>
